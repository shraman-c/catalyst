name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: npm audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Security audit item 8.1: block merges that introduce new
      # high/critical dependency vulnerabilities.
      - name: Audit dependencies
        run: npm audit --audit-level=high
